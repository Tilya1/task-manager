<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <!-- Apply the saved theme before the first paint so the page never flashes white -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("tm-theme");
                var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (dark) document.documentElement.setAttribute("data-theme", "dark");
            } catch (e) {}
        })();
    </script>

    <!-- Icon font only; all layout and styling is in static/style.css -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="app" id="app">

        <!-- ============================ SIDEBAR ============================ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <span class="brand-mark"><i class="bi bi-check2"></i></span>
                    <span>Task Manager</span>
                </div>
                <button type="button" class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
                    <i class="bi bi-moon"></i>
                </button>
            </div>

            <label class="search">
                <i class="bi bi-search"></i>
                <input type="search" id="searchInput" placeholder="Search" autocomplete="off" />
            </label>

            <nav class="nav">
                <button type="button" class="nav-item" data-view="all">
                    <i class="bi bi-inbox"></i><span class="nav-label">All</span><span class="nav-count" data-count="all"></span>
                </button>
                <button type="button" class="nav-item" data-view="today">
                    <i class="bi bi-calendar-check"></i><span class="nav-label">Today</span><span class="nav-count" data-count="today"></span>
                </button>
                <button type="button" class="nav-item" data-view="week">
                    <i class="bi bi-calendar-week"></i><span class="nav-label">Next 7 Days</span><span class="nav-count" data-count="week"></span>
                </button>
                <button type="button" class="nav-item" data-view="nodate">
                    <i class="bi bi-calendar-x"></i><span class="nav-label">No Date</span><span class="nav-count" data-count="nodate"></span>
                </button>
                <button type="button" class="nav-item" data-view="completed">
                    <i class="bi bi-check-circle"></i><span class="nav-label">Completed</span><span class="nav-count" data-count="completed"></span>
                </button>

                <div class="nav-title">Priority</div>
                <button type="button" class="nav-item" data-view="p-high">
                    <i class="bi bi-flag-fill flag-high"></i><span class="nav-label">High</span><span class="nav-count" data-count="p-high"></span>
                </button>
                <button type="button" class="nav-item" data-view="p-medium">
                    <i class="bi bi-flag-fill flag-medium"></i><span class="nav-label">Medium</span><span class="nav-count" data-count="p-medium"></span>
                </button>
                <button type="button" class="nav-item" data-view="p-low">
                    <i class="bi bi-flag-fill flag-low"></i><span class="nav-label">Low</span><span class="nav-count" data-count="p-low"></span>
                </button>
            </nav>
        </aside>

        <!-- ============================ MAIN ============================== -->
        <main class="main">
            <header class="main-header">
                <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="view-title" id="viewTitle">All</h1>
                <span class="view-subtitle" id="viewSubtitle"></span>
                <div class="header-actions">
                    <label class="sort">
                        <i class="bi bi-arrow-down-up"></i>
                        <select id="sortSelect" aria-label="Sort tasks">
                            <option value="default">Default</option>
                            <option value="date">Due date</option>
                            <option value="priority">Priority</option>
                            <option value="title">Title</option>
                            <option value="created">Created</option>
                        </select>
                    </label>
                </div>
            </header>

            <!-- Quick add bar -->
            <form class="add-bar" id="addForm" autocomplete="off">
                <i class="bi bi-plus-lg add-icon"></i>
                <input type="text" id="addTitle" placeholder="Add task" maxlength="200" />
                <!-- Off-screen submit button so Enter submits the form natively -->
                <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true">Add</button>
                <div class="add-tools">
                    <label class="date-chip" id="addDateChip" title="Due date">
                        <i class="bi bi-calendar3"></i>
                        <span class="date-chip-text" id="addDateText"></span>
                        <input type="date" id="addDate" />
                    </label>
                    <button type="button" class="flag-btn" id="addPriorityBtn" data-priority="Medium" title="Priority">
                        <i class="bi bi-flag-fill"></i>
                    </button>
                </div>
            </form>

            <div class="task-list" id="taskList"></div>

            <div class="empty hidden" id="emptyState">
                <i class="bi bi-clipboard-check"></i>
                <p id="emptyText">Nothing here. Add a task above.</p>
            </div>
        </main>

        <!-- ============================ DETAIL PANEL ======================= -->
        <aside class="detail" id="detail">
            <header class="detail-header">
                <button type="button" class="check" id="detailCheck" aria-label="Toggle complete"><i class="bi bi-check"></i></button>
                <label class="date-chip" title="Due date">
                    <i class="bi bi-calendar3"></i>
                    <span class="date-chip-text" id="detailDateText">Date</span>
                    <input type="date" id="detailDate" />
                </label>
                <button type="button" class="flag-btn" id="detailPriorityBtn" data-priority="Medium" title="Priority">
                    <i class="bi bi-flag-fill"></i>
                </button>
                <span class="spacer"></span>
                <button type="button" class="icon-btn" id="detailClose" aria-label="Close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </header>

            <div class="detail-body">
                <input type="text" class="detail-title" id="detailTitle" placeholder="Title" maxlength="200" />
                <textarea class="detail-desc" id="detailDesc" placeholder="Description" rows="8"></textarea>
            </div>

            <footer class="detail-footer">
                <span class="detail-meta" id="detailMeta"></span>
                <span class="spacer"></span>
                <button type="button" class="icon-btn danger" id="detailDelete" title="Delete task" aria-label="Delete task">
                    <i class="bi bi-trash3"></i>
                </button>
            </footer>
        </aside>
    </div>

    <!-- Shared priority picker (positioned next to whichever flag was clicked) -->
    <div class="popover hidden" id="priorityPopover" role="menu">
        <button type="button" class="popover-item" data-priority="High"><i class="bi bi-flag-fill flag-high"></i> High</button>
        <button type="button" class="popover-item" data-priority="Medium"><i class="bi bi-flag-fill flag-medium"></i> Medium</button>
        <button type="button" class="popover-item" data-priority="Low"><i class="bi bi-flag-fill flag-low"></i> Low</button>
    </div>

    <!-- Dimmed backdrop used on small screens when the sidebar / detail panel is open -->
    <div class="scrim" id="scrim"></div>

    <div class="toast hidden" id="toast"></div>

    <!-- Flash messages from the classic form routes are shown as toasts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-msg" data-category="{{ category }}" hidden>{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
